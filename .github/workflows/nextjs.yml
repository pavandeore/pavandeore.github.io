name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev  # This triggers the action on push to the dev branch. Change this to the branch you want to deploy from.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Use the version that works for your project

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Build the project
      - name: Build Next.js project
        run: npm run build

      # Step 5: Export the project
      - name: Export the static site
        run: npm run export

      # Step 6: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out  # This is where the static files are generated after next export
          publish_branch: gh-pages  # The branch where the static files will be deployed
